[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mayday-recon"
version = "1.0.0"
description = "MAYDAY RECON - Attack-based reconciliation testing framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "MithilHM", email = "mithil@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = ["reconciliation", "testing", "fraud-detection", "attack-based", "blockchain"]

dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "pyyaml>=6.0",
    "faker>=20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.0",
]

[project.urls]
Homepage = "https://github.com/MithilHM/MAYDAY-RECON"
Documentation = "https://github.com/MithilHM/MAYDAY-RECON/blob/main/README.md"
Repository = "https://github.com/MithilHM/MAYDAY-RECON"
Issues = "https://github.com/MithilHM/MAYDAY-RECON/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["mayday*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
