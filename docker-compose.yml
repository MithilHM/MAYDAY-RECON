services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    # Production: no bind mount; image contains code.
    # Dev override only (docker-compose.override.yml or uncomment below):
    # volumes:
    #   - .:/app
    volumes:
      - api_data:/data
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
    restart: unless-stopped

  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api_data:
